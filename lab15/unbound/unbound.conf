# unbound.conf — Resolutor Recursivo Seguro con DoT y Filtrado RPZ Escolar
# Colegio Bautista Boliviano Brasileño (CBBB) - UPDS SIS-0150

server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Control de Acceso LAN Escolar
    access-control: 127.0.0.1/32 allow
    access-control: 10.10.10.0/24 allow
    access-control: 10.20.0.0/24 allow
    access-control: 0.0.0.0/0 refuse

    # Privacidad y Seguridad DNS
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: yes

    # Ancla de confianza DNSSEC y validación estricta
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # Redirección de zonas autoritativas internas hacia BIND 9
    private-domain: "cbbb.internal"
    local-zone: "10.in-addr.arpa." transparent

    # Zona de Política de Respuesta (RPZ) para Protección Infantil y Escolar
    module-config: "respip validator iterator"

rpz:
    name: "rpz.escolar.cbbb"
    zonefile: "/etc/unbound/rpz-bloqueos.zone"
    rpz-action-override: nxdomain

# Reenvío hacia BIND 9 para la zona interna institucional
stub-zone:
    name: "cbbb.internal"
    stub-addr: 10.10.10.2
    stub-addr: 10.10.10.3

# Reenvío hacia BIND 9 para la resolución inversa interna
stub-zone:
    name: "10.10.10.in-addr.arpa"
    stub-addr: 10.10.10.2

# Reenvío Seguro Recursivo a Internet mediante DNS-over-TLS (DoT) puerto 853
forward-zone:
    name: "."
    forward-tls-upstream: yes
    # Cloudflare DNS con TLS
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    # Quad9 DNS con TLS y bloqueo de malware
    forward-addr: 9.9.9.9@853#dns.quad9.net
